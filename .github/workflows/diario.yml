# Edición diaria de La Gran Crisis (daily.lagrancrisis.com)
#
# Corre sola todos los días a las 05:12 de Argentina (08:12 UTC), arma la edición
# y la guarda en docs/. Al guardarse en GitHub, Cloudflare Pages la publica.
#
# Reintentos del mismo día: a las 07:13 y a las 10:13 vuelve a correr, solo si
# la edición de hoy todavía no se publicó. Los dos primeros intentos publican
# únicamente una edición completa; el último publica lo que haya salido.
#
# También se puede correr a mano desde la pestaña Actions ("Run workflow").
#
# Aviso de error: GitHub manda un correo cuando una corrida termina en rojo. Para no avisar
# por fallas que se arreglan solas, los intentos 1 y 2 no se ponen en rojo si falla la IA o
# una prueba: lo vuelve a intentar el siguiente. El último intento se pone en rojo si al
# terminar no quedó publicada una edición completa del día.
#
# Claves (Settings > Secrets and variables > Actions): GEMINI_API_KEY y/o
# ANTHROPIC_API_KEY. Opcional: la variable LGC_MODELS para cambiar los modelos
# y su orden sin tocar código.

name: Diario - edición diaria

on:
  schedule:
    - cron: "12 8 * * *"   # 05:12 Argentina, intento 1
    - cron: "13 10 * * *"  # 07:13 Argentina, intento 2
    - cron: "13 13 * * *"  # 10:13 Argentina, último intento
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a procesar (AAAA-MM-DD). Vacío = hoy."
        required: false
        default: ""
      publicar:
        description: "Publicar en el sitio. Si no se marca, solo se arma la edición para revisarla."
        type: boolean
        required: false
        default: false
      intento:
        description: "Solo para el disparador externo (1, 2 o 3). Vacío = corrida a mano."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: diario-edicion
  cancel-in-progress: false

jobs:
  edicion:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: America/Argentina/Buenos_Aires
      PYTHONIOENCODING: utf-8
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LGC_MODELS: ${{ vars.LGC_MODELS }}
      FECHA_PEDIDA: ${{ inputs.fecha }}
      # Corrida automática: la del horario de GitHub o la del disparador externo de Cloudflare
      # (que manda "intento"). Las dos siguen las mismas reglas de reintento y publicación.
      AUTOMATICA: ${{ github.event_name == 'schedule' || inputs.intento != '' }}
      ULTIMO_INTENTO: ${{ (github.event_name == 'schedule' && github.event.schedule == '13 13 * * *') || inputs.intento == '3' }}

    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v5

      - name: Definir la fecha y ver si hace falta correr
        run: |
          if [ -n "$FECHA_PEDIDA" ]; then
            if ! [[ "$FECHA_PEDIDA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::La fecha debe tener el formato AAAA-MM-DD."
              exit 1
            fi
            FECHA="$FECHA_PEDIDA"
          else
            FECHA="$(date +%F)"
          fi
          CARPETA="docs/${FECHA//-//}"
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          echo "CARPETA_EDICION=$CARPETA" >> "$GITHUB_ENV"
          if [ "$AUTOMATICA" = "true" ] && [ -f "$CARPETA/data.json" ]; then
            echo "La edición $FECHA ya está publicada: este reintento no hace falta."
            echo "SALTEAR=1" >> "$GITHUB_ENV"
          else
            echo "Edición a procesar: $FECHA (último intento del día: $ULTIMO_INTENTO)"
            echo "SALTEAR=0" >> "$GITHUB_ENV"
          fi

      - name: Preparar Python 3.13
        if: env.SALTEAR == '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        if: env.SALTEAR == '0'
        run: pip install -r requirements.txt pytest

      - name: Revisar que haya al menos una clave de IA
        if: env.SALTEAR == '0'
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta GEMINI_API_KEY o ANTHROPIC_API_KEY en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Pruebas (si fallan, no se publica)
        id: pruebas
        if: env.SALTEAR == '0'
        continue-on-error: ${{ env.AUTOMATICA == 'true' && env.ULTIMO_INTENTO != 'true' }}
        run: python -m pytest -q tests/test_publicacion_sin_errores.py

      - name: Armar la edición
        id: armar
        if: env.SALTEAR == '0' && steps.pruebas.outcome == 'success'
        continue-on-error: ${{ env.AUTOMATICA == 'true' && env.ULTIMO_INTENTO != 'true' }}
        run: python src/main.py --close --date "$FECHA"

      - name: ¿Salió completa?
        if: env.SALTEAR == '0'
        run: |
          if python scripts/edicion_completa.py "$FECHA"; then
            echo "COMPLETA=1" >> "$GITHUB_ENV"
          else
            echo "COMPLETA=0" >> "$GITHUB_ENV"
          fi

      - name: Resumen de la corrida
        if: always() && env.SALTEAR == '0'
        run: python scripts/resumen_corrida.py "$FECHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar (guardar en GitHub; Cloudflare la sube al sitio)
        if: >-
          success() && env.SALTEAR == '0' &&
          steps.pruebas.outcome == 'success' && steps.armar.outcome == 'success' && (
            (env.AUTOMATICA != 'true' && inputs.publicar) ||
            (env.AUTOMATICA == 'true' && (env.COMPLETA == '1' || env.ULTIMO_INTENTO == 'true'))
          )
        run: |
          git config user.name "diario-lagrancrisis[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git commit -m "Diario: edición $FECHA"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Avisar que se espera al próximo intento
        if: success() && env.SALTEAR == '0' && env.AUTOMATICA == 'true' && env.COMPLETA == '0' && env.ULTIMO_INTENTO != 'true'
        run: echo "::warning::La edición $FECHA no salió completa (o falló una prueba o la IA). No se publica todavía; se reintenta en el próximo horario."

      - name: Guardar registros de la corrida (30 días)
        if: always() && env.SALTEAR == '0'
        uses: actions/upload-artifact@v5
        with:
          name: diario-${{ env.FECHA }}-corrida-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            raw/
            logs/
            ${{ env.CARPETA_EDICION }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Avisar si hoy no quedó una edición completa (último intento)
        if: always() && env.ULTIMO_INTENTO == 'true'
        run: |
          if python3 scripts/edicion_completa.py "$FECHA"; then
            echo "La edición $FECHA está publicada y completa."
          else
            echo "::error::Último intento del día: la edición $FECHA no quedó publicada completa. Revisar esta corrida."
            exit 1
          fi
