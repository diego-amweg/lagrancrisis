# Diagnóstico de los modelos de IA del Diario (Gemini y Claude): si cada uno
# responde hoy y qué modelos de Gemini puede ver la clave.
# Se corre a mano desde la pestaña Actions ("Run workflow"). No publica nada.
# Gasta una llamada mínima por modelo configurado.

name: Diario - probar modelos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LGC_MODELS: ${{ vars.LGC_MODELS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar modelos
        run: python scripts/check_gemini.py | tee resultado.txt
      - name: Mostrar resultado en la página de la corrida
        if: always()
        run: |
          {
            echo '```'
            cat resultado.txt 2>/dev/null || echo "Sin resultado"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
